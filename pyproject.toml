[project]
name = "hotel-booking-cancellation"
version = "0.1.0"
description = "Predict hotel booking cancellations at the moment a booking is made"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "requests>=2.34.2",
]
